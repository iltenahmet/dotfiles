# Number windows from 1 so Cmd-1 is the first window.
set -g base-index 1

# Show each pane's title on its top border.
set -g pane-border-status top
set -g pane-border-format "#[reverse] #{pane_index}: #{pane_title} #[default]"

# Draw the line between panes thick.
set -g pane-border-lines heavy

# Grey out the text in panes you are not in.
set -g window-style 'fg=colour245'
set -g window-active-style 'fg=terminal'

# Mouse drag selects inside one pane and copies to the macOS clipboard.
set -g mouse on
set -s copy-command 'pbcopy'

# Pass Shift-Enter through to apps so it can mean "new line".
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Prefix O: o5 agent layout, orchestrator big on the left, agents 1-4 stacked on the right.
bind O run-shell "~/.local/bin/o5-layout '#{window_id}'"

# Prefix Shift-Left/Right: move the current window one place left or right.
bind S-Left swap-window -t -1 \; select-window -t -1
bind S-Right swap-window -t +1 \; select-window -t +1

set -g pane-border-style 'fg=#75715e'
set -g pane-active-border-style 'fg=#a9dc76'
set -g status-style 'bg=#3e3d32,fg=#f8f8f2'
set -g window-status-current-style 'bg=#a9dc76,fg=#272822'
